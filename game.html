<!DOCTYPE html>
<html>
<head>
<title>Catch Me!</title>
<style>
#catchButton { position:absolute; top:150px; left:200px; z-index:1; }
</style>
</head>
<body>
<h1>Catch Me!</h1>
<p>Score: <span id="score">0</span></p>
<button id="catchButton" onclick="catchMe()">Catch Me</button>

<iframe id="portalFrame" src="portal.html"
  style="opacity:0; position:absolute; top:150px; left:400px; width:600px; height:400px; z-index:2;">
</iframe>

<button onclick="revealAttack()">Reveal Hidden Page</button>

<script>
let score = 0;
const attemptsBeforeAlign = 3; // number of clicks before it snaps onto Login

function catchMe() {
  score++;
  document.getElementById("score").textContent = score;
  const button = document.getElementById("catchButton");

  if (score === attemptsBeforeAlign) {
    alignWithLoginButton(button);
  } else {
    button.style.left = Math.floor(Math.random() * 500) + "px";
    button.style.top = Math.floor(Math.random() * 400) + "px";
  }
}

function alignWithLoginButton(catchButton) {
  const iframe = document.getElementById("portalFrame");
  const iframeRect = iframe.getBoundingClientRect();

  // find the Login button inside the iframe's document
  const loginButton = iframe.contentWindow.document.querySelector("button");
  const loginRect = loginButton.getBoundingClientRect();

  // loginRect is relative to the iframe's own viewport,
  // so add the iframe's page position to get real page coordinates
  const targetX = iframeRect.left + loginRect.left;
  const targetY = iframeRect.top + loginRect.top;

  catchButton.style.left = targetX + "px";
  catchButton.style.top = targetY + "px";
  catchButton.style.width = loginRect.width + "px";
  catchButton.style.height = loginRect.height + "px";
}

function revealAttack() {
  document.getElementById("portalFrame").style.opacity = 0.5;
}
</script>
</body>
</html>
